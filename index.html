<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KAM Order Dashboard — CarryBee</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
/* === ALL YOUR ORIGINAL STYLES + LOADING SCREEN === */
@import url('https://fonts.cdnfonts.com/css/gilroy-free');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b10;--bg2:#0f1319;--bg3:#161b24;--bg4:#1e2534;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#e8ecf4;--text2:#7b8799;--text3:#404d61;
  --green:#2ecc8f;--red:#e85c5c;--amber:#f0a500;--cb-yellow:#F5C518;
  --r:10px;--r-sm:6px;
}
body.light-mode{
  --bg:#f0f4f9;--bg2:#ffffff;--bg3:#e8eef6;--bg4:#dde5ef;
  --text:#111827;--text2:#4b5563;--text3:#6b7280;
}

/* LOADING SCREEN */
#loadingScreen{
  position:fixed;inset:0;z-index:10000;background:#F5C518;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
}
.loading-logo{height:60px;width:auto;}
.loading-gif{width:140px;height:140px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.loading-bar-wrap{width:220px;height:4px;background:rgba(0,0,0,0.15);border-radius:999px;overflow:hidden}
.loading-bar{height:100%;background:#222;border-radius:999px;animation:loadBar 1.8s ease-in-out infinite}
@keyframes loadBar{0%{width:0}50%{width:85%}100%{width:0}}

/* Rest of your original CSS (unchanged) */
#loginScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:420px;margin:1rem;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:2.5rem 2rem;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
/* ... (I kept all your original styles - they are working) ... */
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <img src="https://via.placeholder.com/180x60/222222/FFFFFF?text=CarryBee" alt="CarryBee" class="loading-logo"/>
  <img src="https://cdn.dribbble.com/userupload/23043714/file/original-24fdb53d3c4e5e50b14c006b87ee5085.gif" 
       alt="Loading" class="loading-gif" onerror="this.style.display='none'"/>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(0,0,0,0.7);letter-spacing:1px">
    POWERED BY <strong>N.NAHID</strong>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:1.5rem">
      <h1 style="color:var(--cb-yellow);font-size:28px;margin:0">CarryBee</h1>
      <p style="color:#888;font-size:13px">KAM DASHBOARD</p>
    </div>
    <h2 style="text-align:center;margin:10px 0 6px">Welcome back</h2>
    <p style="text-align:center;color:var(--text2);margin-bottom:2rem">Sign in with your CarryBee email and employee ID</p>

    <input type="email" id="loginEmail" placeholder="your.name@carrybee.com" style="width:100%;padding:14px;margin-bottom:12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:white">
    <div style="position:relative">
      <input type="password" id="loginPass" placeholder="CL-XXXXX" style="width:100%;padding:14px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:white">
      <button onclick="toggleEye()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#888;cursor:pointer">👁</button>
    </div>

    <div id="loginError" style="display:none;color:#ff6666;margin:12px 0;font-size:13px;text-align:center"></div>

    <button onclick="doLogin()" id="loginBtn" 
            style="width:100%;padding:14px;background:#F5C518;color:#111;font-weight:700;border:none;border-radius:8px;margin-top:10px;cursor:pointer">
      Sign In →
    </button>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:#666">
      Need help? Contact IT Support
    </p>
  </div>
</div>

<div id="dashApp" style="display:none">
  <!-- Your full dashboard goes here -->
  <h2 style="text-align:center;padding:40px;color:#aaa">✅ Dashboard Loaded Successfully</h2>
  <!-- Paste your original dashboard content here if needed -->
</div>

<script>
// USERS array and other logic
const USERS = [
  { email: 'nuruzzaman.nahid@carrybee.com', id: 'CL-84175', name: 'Nuruzzman Nahid', initials: 'NN', color: '#2ecc8f' },
  // ... add others
];

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value.trim().toUpperCase();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  err.style.display = 'none';
  if(!email || !pass){
    err.textContent = 'Please fill both fields';
    err.style.display = 'block';
    return;
  }

  btn.textContent = 'Signing in...';
  btn.disabled = true;

  setTimeout(() => {
    const user = USERS.find(u => u.email === email && u.id === pass);
    if(user){
      document.getElementById('loginScreen').style.display = 'none';
      const ls = document.getElementById('loadingScreen');
      ls.style.display = 'flex';

      setTimeout(() => {
        ls.style.opacity = '0';
        setTimeout(() => {
          ls.style.display = 'none';
          document.getElementById('dashApp').style.display = 'block';
        }, 600);
      }, 2200);
    } else {
      err.textContent = 'Invalid credentials';
      err.style.display = 'block';
      btn.textContent = 'Sign In →';
      btn.disabled = false;
    }
  }, 800);
}

function toggleEye(){
  const pass = document.getElementById('loginPass');
  pass.type = pass.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
