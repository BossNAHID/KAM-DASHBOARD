<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KAM Order Dashboard — The Grid Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<!-- Gilroy via Fontshare CDN -->
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.cdnfonts.com/css/gilroy-free');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b10;--bg2:#0f1319;--bg3:#161b24;--bg4:#1e2534;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#e8ecf4;--text2:#7b8799;--text3:#404d61;
  --green:#2ecc8f;--green-dim:rgba(46,204,143,0.12);--green-border:rgba(46,204,143,0.3);
  --amber:#f0a500;--amber-dim:rgba(240,165,0,0.12);--amber-border:rgba(240,165,0,0.3);
  --red:#e85c5c;--red-dim:rgba(232,92,92,0.12);--red-border:rgba(232,92,92,0.3);
  --blue:#4a90e2;
  --kam-0:#4a90e2;--kam-1:#2ecc8f;--kam-2:#f0a500;--kam-3:#e85c5c;--kam-4:#b07ef7;
  --r:10px;--r-sm:6px;
  /* CarryBee brand */
  --cb-yellow:#F5C518;--cb-dark:#3C3C3C;
  /* Gilroy fallback stack */
  --font-display:'Gilroy','Clash Display','Syne',system-ui,sans-serif;
}
body.light-mode{
  --bg:#f0f4f9;--bg2:#ffffff;--bg3:#e8eef6;--bg4:#dde5ef;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --text:#111827;--text2:#4b5563;--text3:#6b7280;
  --green:#1a9e6a;--green-dim:rgba(26,158,106,0.1);--green-border:rgba(26,158,106,0.3);
  --amber:#c97f00;--amber-dim:rgba(201,127,0,0.1);--amber-border:rgba(201,127,0,0.3);
  --red:#c94040;--red-dim:rgba(201,64,64,0.09);--red-border:rgba(201,64,64,0.28);
  --blue:#2563eb;
}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;transition:background 0.25s,color 0.25s}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(74,144,226,0.06),transparent);pointer-events:none;z-index:0}
body.light-mode::before{background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(37,99,235,0.04),transparent)}

/* ══ LOADING SCREEN ══ */
#loadingScreen{
  position:fixed;inset:0;z-index:10000;background:#F5C518;
  display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;
  animation:loadFadeIn 0.3s ease both;
}
@keyframes loadFadeIn{from{opacity:0}to{opacity:1}}
@keyframes loadFadeOut{from{opacity:1}to{opacity:0}}
#loadingScreen.hiding{animation:loadFadeOut 0.4s ease both;}
.loading-logo{height:52px;width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15))}
.loading-gif{width:160px;height:160px;object-fit:contain;border-radius:16px}
.loading-powered{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:0.15em;text-transform:uppercase;color:rgba(0,0,0,0.5)}
.loading-powered span{color:rgba(0,0,0,0.75)}
.loading-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,0.12);border-radius:99px;overflow:hidden}
.loading-bar{height:100%;background:#3C3C3C;border-radius:99px;animation:loadBar 2s ease-in-out infinite}
@keyframes loadBar{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}

/* ══ LOGIN SCREEN ══ */
#loginScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:background 0.25s}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 30%, rgba(74,144,226,0.08), transparent),radial-gradient(ellipse 50% 50% at 80% 70%, rgba(46,204,143,0.05), transparent);pointer-events:none}
#loginScreen::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(74,144,226,0.04) 1px, transparent 1px),linear-gradient(90deg, rgba(74,144,226,0.04) 1px, transparent 1px);background-size:40px 40px;pointer-events:none}
.login-card{position:relative;z-index:1;width:100%;max-width:430px;margin:1rem;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:2.5rem 2.25rem 2rem;box-shadow:0 24px 80px rgba(0,0,0,0.4),0 0 0 1px rgba(74,144,226,0.08);animation:loginFadeUp 0.5s cubic-bezier(.4,0,.2,1) both}
@keyframes loginFadeUp{from{opacity:0;transform:translateY(20px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
/* CarryBee logo in login */
.login-logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.login-logo-img{height:40px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(245,197,24,0.2))}
body.light-mode .login-logo-img{filter:none}
.login-logo-sub{font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:0.1em;text-transform:uppercase}
.login-heading{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.02em;margin-bottom:6px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:1.75rem;line-height:1.5}
.login-field{margin-bottom:1rem}
.login-label{display:block;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.login-input-wrap{position:relative}
.login-input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;transition:color 0.15s}
.login-input{width:100%;padding:10px 12px 10px 36px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;font-family:'IBM Plex Mono',monospace;outline:none;transition:border-color 0.15s,background 0.15s,box-shadow 0.15s}
.login-input:focus{border-color:rgba(245,197,24,0.5);box-shadow:0 0 0 3px rgba(245,197,24,0.08)}
.login-input::placeholder{color:var(--text3);font-family:'IBM Plex Sans',sans-serif;font-size:12px}
.login-input:focus + .login-input-icon,.login-input-wrap:focus-within .login-input-icon{color:var(--cb-yellow)}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:4px;transition:color 0.15s;font-size:13px}
.eye-btn:hover{color:var(--text2)}
.login-error{display:none;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r-sm);background:var(--red-dim);border:1px solid var(--red-border);font-size:11px;color:var(--red);margin-bottom:1rem;animation:shake 0.35s ease}
.login-error.show{display:flex}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.login-btn{width:100%;padding:11px;border-radius:var(--r-sm);background:linear-gradient(135deg,#f5c518,#e0b010);color:#1a1a1a;font-size:13px;font-weight:700;font-family:var(--font-display);border:none;cursor:pointer;letter-spacing:0.02em;transition:opacity 0.15s,transform 0.1s,box-shadow 0.15s;box-shadow:0 4px 16px rgba(245,197,24,0.3);position:relative;overflow:hidden}
.login-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);opacity:0;transition:opacity 0.15s}
.login-btn:hover{opacity:0.92;transform:translateY(-1px);box-shadow:0 6px 22px rgba(245,197,24,0.38)}
.login-btn:hover::after{opacity:1}
.login-btn:active{transform:translateY(0)}
.login-btn.loading{opacity:0.7;cursor:not-allowed}
.login-footer-note{margin-top:1.25rem;text-align:center;font-size:10px;color:var(--text3);line-height:1.6}
/* Copyright notice in login */
.login-copyright{margin-top:1rem;padding-top:0.75rem;border-top:1px solid var(--border);text-align:center;font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em}
.login-copyright span{color:var(--cb-yellow)}

.user-badge{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:99px;background:var(--bg3);border:1px solid var(--border2);font-size:11px;color:var(--text2);cursor:default}
.user-avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.logout-btn{padding:2px 8px;border-radius:99px;font-size:10px;font-weight:500;background:var(--red-dim);color:var(--red);border:1px solid var(--red-border);cursor:pointer;font-family:inherit;transition:background 0.15s;margin-left:2px}
.logout-btn:hover{background:rgba(232,92,92,0.2)}

/* ══ DASHBOARD ══ */
#dashApp{display:none}
.app{display:flex;min-height:100vh}
.sidebar{width:215px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.28s cubic-bezier(.4,0,.2,1),background 0.25s,border-color 0.25s}
/* Sidebar logo area with CarryBee branding */
.logo{padding:1rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.logo-img{height:26px;width:auto;object-fit:contain;display:block}
body.light-mode .logo-img{filter:none}
.logo-img-dark{display:block}
.logo-tag{font-size:8px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}
.nav-section{padding:1rem 0.75rem 0.4rem;font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 1rem;margin:1px 6px;border-radius:var(--r-sm);cursor:pointer;color:var(--text2);font-size:12px;transition:all 0.15s;border:none;background:none;width:calc(100% - 12px);text-align:left;font-family:inherit}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(245,197,24,0.1);color:var(--cb-yellow);font-weight:500}
.nav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.alert-count{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;font-family:'IBM Plex Mono',monospace}
/* Sidebar footer with copyright */
.sidebar-footer{margin-top:auto;padding:0.85rem 1rem;border-top:1px solid var(--border)}
.sidebar-footer .lbl{font-size:10px;color:var(--text3)}
.sidebar-footer .val{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace}
.sidebar-copyright{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:8px;color:var(--text3);font-family:'IBM Plex Mono',monospace;line-height:1.5}
.sidebar-copyright .copy-highlight{color:var(--cb-yellow);font-weight:500}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99;opacity:0;transition:opacity 0.25s}
.sidebar-overlay.active{opacity:1}
.hamburger{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--border2);cursor:pointer;color:var(--text);flex-shrink:0}
.hamburger svg{width:18px;height:18px}
.main{flex:1;min-width:0;padding:1.5rem;position:relative;z-index:1;transition:background 0.25s}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.4rem;flex-wrap:wrap;gap:0.75rem}
.topbar-left{display:flex;align-items:flex-start;gap:10px}
.page-title{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-0.02em;color:var(--text)}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid var(--border2);color:var(--text2);background:var(--bg2);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.chip.active{border-color:rgba(245,197,24,0.5);color:var(--cb-yellow);background:rgba(245,197,24,0.08)}
#themeToggle{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:inherit;transition:all 0.18s;user-select:none}
#themeToggle:hover{background:var(--bg4);color:var(--text)}
#themeToggle .toggle-icon{font-size:13px;transition:transform 0.3s}
body.light-mode #themeToggle .toggle-icon{transform:rotate(180deg)}
.alert-banner{background:rgba(232,92,92,0.07);border:1px solid rgba(232,92,92,0.25);border-radius:var(--r);padding:10px 14px;margin-bottom:1.1rem;display:flex;align-items:center;gap:10px;animation:pulse-border 2.5s infinite}
@keyframes pulse-border{0%,100%{border-color:rgba(232,92,92,0.25)}50%{border-color:rgba(232,92,92,0.55)}}
.alert-text{font-size:12px;color:var(--text2)}.alert-text strong{color:var(--red)}
.alert-cta{margin-left:auto;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:500;background:var(--red-dim);color:var(--red);border:1px solid var(--red-border);cursor:pointer;white-space:nowrap;font-family:inherit;transition:background 0.15s}
.alert-cta:hover{background:rgba(232,92,92,0.2)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.25rem}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;position:relative;overflow:hidden;animation:fadeUp 0.4s ease both;transition:background 0.25s,border-color 0.25s}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--mc,#f5c518)}
.metric-lbl{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.metric-val{font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-0.02em;color:var(--text);line-height:1}
.metric-sub{font-size:11px;margin-top:5px;color:var(--text3)}
.up{color:var(--green)}.dn{color:var(--red)}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:1rem;animation:fadeUp 0.35s ease both;transition:background 0.25s,border-color 0.25s}
.panel-title{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.kam-select{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.kam-btn{padding:5px 13px;border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border2);color:var(--text2);background:transparent;transition:all 0.15s;font-family:inherit}
.search-input{padding:6px 12px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;font-family:inherit;width:220px;outline:none;transition:border-color 0.15s,background 0.25s,color 0.25s}
.search-input:focus{border-color:rgba(245,197,24,0.4)}
.search-input::placeholder{color:var(--text3)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-size:9px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text3);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
thead th.r{text-align:right}thead th.c{text-align:center}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;transition:background 0.1s}
tbody td.r{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px}
tbody td.c{text-align:center}
tbody tr:hover td{background:var(--bg3)}
tbody tr:last-child td{border-bottom:none}
.merchant-name{font-weight:500;font-size:12px}
.merchant-id{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace}
.hub-badge{padding:2px 7px;border-radius:4px;font-size:10px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.health-track{background:var(--bg3);border-radius:99px;height:6px;overflow:hidden;margin-top:5px}
.health-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.health-poor .health-fill{background:linear-gradient(90deg,#c0392b,#e85c5c)}
.health-good .health-fill{background:linear-gradient(90deg,#e67e22,#f0a500)}
.health-better .health-fill{background:linear-gradient(90deg,#27ae60,#2ecc8f)}
.hbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;white-space:nowrap}
.hbadge-poor{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.hbadge-good{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border)}
.hbadge-better{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}
.zero-alert-row td{background:rgba(232,92,92,0.04)!important}
.zero-alert-row:hover td{background:rgba(232,92,92,0.09)!important}
.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s ease-in-out infinite;margin-right:4px;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 4px var(--red)}50%{opacity:0.2;box-shadow:none}}
.dod-scroll{overflow-x:auto;padding-bottom:8px}
.dod-dates-row{display:flex;padding:0 0 4px 0;gap:3px}
.dod-name-spacer{width:168px;flex-shrink:0}
.dod-date-lbl{width:50px;flex-shrink:0;text-align:center;font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace}
.dod-kam-hdr{padding:6px 10px;border-radius:var(--r-sm);margin:8px 0 5px;font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dod-row{display:flex;gap:3px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.dod-row:last-child{border-bottom:none}
.dod-cell-name{width:168px;flex-shrink:0;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.dod-cell{width:50px;height:32px;border-radius:5px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spark{display:inline-flex;align-items:flex-end;gap:1.5px;height:18px;vertical-align:middle}
.spark-bar{width:3px;border-radius:1px;flex-shrink:0}
.alert-card{background:var(--bg3);border:1px solid var(--red-border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:10px;transition:background 0.25s}
.alert-card-top{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-start;margin-bottom:10px}
.alert-recent{display:flex;gap:3px;margin-top:6px}
.alert-day-cell{flex:1;background:var(--bg4);border-radius:5px;padding:5px 3px;text-align:center}
/* Page-level footer copyright */
.page-footer{padding:1rem 0 0.5rem;margin-top:0.5rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.page-footer-logo{height:18px;width:auto;opacity:0.55;transition:opacity 0.2s}
.page-footer-logo:hover{opacity:0.85}
.page-footer-copy{font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em}
.page-footer-copy span{color:var(--cb-yellow)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.metric:nth-child(1){animation-delay:.04s}.metric:nth-child(2){animation-delay:.08s}
.metric:nth-child(3){animation-delay:.12s}.metric:nth-child(4){animation-delay:.16s}
.metric:nth-child(5){animation-delay:.20s}.metric:nth-child(6){animation-delay:.24s}

@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,0.35)}.sidebar.open{transform:translateX(0)}.sidebar-overlay{display:block}.hamburger{display:flex}.main{padding:1rem}.two-col{grid-template-columns:1fr 1fr}}
